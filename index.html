<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BSGC - School Calendar</title>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- FullCalendar & ICAL.js -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js"></script>

  <!-- Marked.js for dynamic Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>BSGC School Calendar</h1>
      <div class="btn-group">
        <a id="gcal-btn" href="#" target="_blank" class="btn gcal-btn">
          ➕ Add to Google Calendar (Android)
        </a>
        <a id="apple-btn" href="#" class="btn apple-btn">
          🍏 Add to Apple Calendar (iPhone)
        </a>
        <a id="sub-link" href="#" class="btn ics-btn">
          📲 Download bsgc_calendar.ics File
        </a>
      </div>
    </header>

    <div id="calendar"></div>

    <!-- Container where README.md content will automatically load -->
    <section id="readme-content" class="readme-section"></section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Get full absolute URL of the .ics file
      const fullIcsUrl = new URL('bsgc_calendar.ics', window.location.href).href;

      // 2. Direct .ics download link
      document.getElementById('sub-link').href = fullIcsUrl;

      // 3. Webcal protocol link for Apple / iOS & Google Calendar
      const webcalUrl = fullIcsUrl.replace(/^https?:\/\//, 'webcal://');
      
      // Apple / iOS button
      document.getElementById('apple-btn').href = webcalUrl;

      // 4. Google Calendar link handling
      const isAndroid = /Android/i.test(navigator.userAgent);
      const gcalBtn = document.getElementById('gcal-btn');

      // Target web URL with explicit user route & webcal CID
      const targetUrl = `https://calendar.google.com/calendar/u/0/r?cid=${encodeURIComponent(webcalUrl)}`;
      
      // Google redirector link to prevent Android OS app intent matching
      const androidBypassUrl = `https://www.google.com/url?q=${encodeURIComponent(targetUrl)}`;

      gcalBtn.href = isAndroid ? androidBypassUrl : targetUrl;
      gcalBtn.target = "_blank";
      gcalBtn.rel = "noopener noreferrer";

      if (isAndroid) {
        gcalBtn.addEventListener('click', function(e) {
          e.preventDefault();
          window.open(androidBypassUrl, '_blank', 'noopener,noreferrer');
        });
      }
      
      // 5. Fetch and render README.md dynamically
      fetch('./README.md')
        .then(response => {
          if (!response.ok) throw new Error('README.md file not found');
          return response.text();
        })
        .then(markdown => {
          marked.setOptions({ gfm: true, breaks: true });
          document.getElementById('readme-content').innerHTML = marked.parse(markdown);
        })
        .catch(err => {
          console.error('Failed to load README.md:', err);
        });

      // 6. FullCalendar Setup
      const isMobile = window.innerWidth < 768;
      const calendarEl = document.getElementById('calendar');

      // Detect user's preferred browser language
      const userLang = (navigator.language || navigator.userLanguage || 'es').split('-')[0];

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: userLang,
        firstDay: 1,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: isMobile ? 'dayGridMonth,listMonth' : 'dayGridMonth,listMonth'
        },
        events: {
          url: fullIcsUrl,
          format: 'ics'
        },
        eventClick: function(info) {
          if (info.event.url) {
            info.jsEvent.preventDefault();
            window.open(info.event.url, "_blank");
          }
        }
      });

      calendar.render();
    });
  </script>

</body>
</html>
