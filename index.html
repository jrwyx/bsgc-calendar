<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSGC - School Calendar</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- ICAL.js parser dependency (Must load BEFORE FullCalendar iCal plugin) -->
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>

  <!-- FullCalendar & iCalendar Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales-all.global.min.js"></script>

  <!-- Marked.js for dynamic Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <main class="container">
    <header class="site-header">
      <h1 class="site-title">BSGC School Calendar</h1>
      <div class="btn-group">
        <!-- Google Calendar Button -->
        <a id="gcal-btn" href="#" target="_blank" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
          </svg>
          <span>Google Calendar (Android)</span>
        </a>

        <!-- Apple Calendar Button -->
        <a id="apple-btn" href="#" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.67-.82 1.13-1.96.1-3.02-1.18.1-2.57.85-3.32 1.73-.61.72-1.15 1.88-.91 2.99 1.32.1 2.62-.68 3.23-1.7"/>
          </svg>
          <span>Apple Calendar (iPhone)</span>
        </a>

        <!-- Download ICS Button -->
        <a id="sub-link" href="#" download="bsgc_calendar.ics" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download .ics</span>
        </a>
      </div>
    </header>

    <div id="calendar"></div>

    <!-- Dynamic README Content -->
    <section id="readme-content" class="readme-section"></section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Cleanly resolve directory path excluding query strings / anchors
      const origin = window.location.origin;
      const pathname = window.location.pathname;
      const basePath = pathname.substring(0, pathname.lastIndexOf('/') + 1);
      const baseUrl = origin + basePath;
      const fullIcsUrl = baseUrl + 'bsgc_calendar.ics';

      // 2. Direct .ics download link
      document.getElementById('sub-link').href = fullIcsUrl;

      // 3. Webcal protocol link for Apple / iOS & Google Calendar
      const webcalUrl = fullIcsUrl.replace(/^https?:\/\//, 'webcal://');
      const httpIcsUrl = fullIcsUrl.replace(/^https?:\/\//, 'https://');

      // Apple / iOS button
      document.getElementById('apple-btn').href = webcalUrl;

      // 4. Google Calendar link handling (fixed Desktop + Android)
      const isAndroid = /Android/i.test(navigator.userAgent);
      const gcalBtn = document.getElementById('gcal-btn');

      const targetUrl = `https://calendar.google.com/calendar/render?cid=${encodeURIComponent(webcalUrl)}`;
      const androidBypassUrl = `https://www.google.com/url?q=${encodeURIComponent(targetUrl)}`;

      gcalBtn.href = isAndroid ? androidBypassUrl : targetUrl;

      if (isAndroid) {
        gcalBtn.addEventListener('click', function(e) {
          e.preventDefault();
          window.open(androidBypassUrl, '_blank', 'noopener,noreferrer');
        });
      }

      // 5. Fetch and render README.md dynamically
      fetch(baseUrl + 'README.md')
        .then(response => {
          if (!response.ok) throw new Error('README.md file not found');
          return response.text();
        })
        .then(markdown => {
          marked.setOptions({ gfm: true, breaks: true });
          const parsed = marked.parse(markdown);
          return parsed instanceof Promise ? parsed : Promise.resolve(parsed);
        })
        .then(html => {
          document.getElementById('readme-content').innerHTML = html;
        })
        .catch(err => {
          console.error('Failed to load README.md:', err);
        });

      // 6. FullCalendar Setup
      const calendarEl = document.getElementById('calendar');
      const userLang = (navigator.language || navigator.userLanguage || 'es').split('-')[0];

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: userLang,
        firstDay: 1,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,listMonth'
        },
        events: {
          url: fullIcsUrl,
          format: 'ics'
        },
        eventClick: function(info) {
          if (info.event.url) {
            info.jsEvent.preventDefault();
            window.open(info.event.url, "_blank");
          }
        },
        eventSourceFailure: function(error) {
          console.error('Failed to load .ics file:', error);
        }
      });

      calendar.render();
    });
  </script>

</body>
</html>
