name: Sync BSGC Calendar

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Random Offset Step ---
      - name: Wait for random time delay
        run: |
          # Generates a random number of seconds between 0 and 3600 (0 to 60 minutes)
          DELAY=$((RANDOM % 3600))
          echo "Delaying execution by $DELAY seconds ($(($DELAY / 60)) minutes)..."
          sleep $DELAY

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper and Generate iCal
        run: python bsgc_to_ical.py

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          # Exclude non-web repository files from the gh-pages branch
          exclude_assets: '.github,*.py,requirements.txt,README.md'
